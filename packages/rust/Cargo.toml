[package]
name = "odin-sig"
version = "0.1.1"
edition = "2021"
description = "LSH signature generation for AI prompt similarity detection"
license = "MIT"
repository = "https://github.com/0din/sig-sdk"
keywords = ["lsh", "similarity", "embeddings", "signature", "hashing"]
categories = ["algorithms", "cryptography"]

[features]
default = ["openai", "onnx"]
openai = ["dep:reqwest"]
onnx = ["dep:tract-onnx", "dep:tokenizers", "dep:dirs"]
cm-lsh = []  # CM-LSH support (no extra deps, uses existing lsh.rs internals)

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

# OpenAI feature
reqwest = { version = "0.12", features = ["json"], optional = true }

# ONNX feature
tract-onnx = { version = "0.21", optional = true }
tokenizers = { version = "0.20", features = ["http"], optional = true }
dirs = { version = "5.0", optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
approx = "0.5"
tempfile = "3.26"
rand = "0.8"

[[example]]
name = "generate_vectors"
path = "examples/generate_vectors.rs"
required-features = []

[[example]]
name = "generate_cm_lsh_vectors"
path = "examples/generate_cm_lsh_vectors.rs"
required-features = ["cm-lsh"]

[[example]]
name = "basic_signature"
path = "examples/basic_signature.rs"
required-features = []

[[example]]
name = "similarity_comparison"
path = "examples/similarity_comparison.rs"
required-features = []

[[example]]
name = "duplicate_detection"
path = "examples/duplicate_detection.rs"
required-features = []

[[example]]
name = "cm_lsh_example"
path = "examples/cm_lsh_example.rs"
required-features = ["cm-lsh"]

[[example]]
name = "sign_text"
path = "examples/sign_text.rs"
required-features = ["onnx"]

[[example]]
name = "benchmark_signatures"
path = "examples/benchmark_signatures.rs"
required-features = []
