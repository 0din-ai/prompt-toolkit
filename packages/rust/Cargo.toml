[package]
name = "odin-prompt-toolkit"
version = "0.8.0"
edition = "2021"
description = "LSH signature generation for AI prompt similarity detection"
license = "MIT"
repository = "https://github.com/0din-ai/prompt-toolkit"
keywords = ["lsh", "similarity", "embeddings", "signature", "hashing"]
categories = ["algorithms", "cryptography"]

[features]
default = ["openai", "onnx"]
openai = ["dep:reqwest", "reqwest?/json"]
onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:dirs", "dep:reqwest", "dep:futures-util", "reqwest?/stream"]
susfactor = ["onnx"]
# Remote Vertex AI serving backend for SusFactor. Deliberately excludes ort/ndarray
# so it compiles without the in-pod inference runtime (see spec §7).
susfactor-vertex = ["dep:gcp_auth", "dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-tracing", "dep:tokenizers", "dep:dirs", "dep:futures-util", "reqwest?/json", "reqwest?/stream"]
cm-lsh = []  # CM-LSH support (no extra deps, uses existing lsh.rs internals)
threatfeed = ["dep:reqwest", "reqwest?/json", "dep:dirs", "dep:chrono", "dep:urlencoding"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

# json: openai + threatfeed; stream: onnx model download
reqwest = { version = "0.13", optional = true }
futures-util = { version = "0.3", optional = true }

# ONNX feature (ONNX Runtime via `ort`, matching Heimdall's production provider)
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"], optional = true }
ndarray = { version = "0.17", default-features = false, features = ["std"], optional = true }
tokenizers = { version = "0.23", features = ["http"], optional = true }
dirs = { version = "6.0", optional = true }

# SusFactor Vertex feature: GCP OAuth2 access tokens (ADC + GKE Workload Identity)
gcp_auth = { version = "0.12", optional = true }

# SusFactor Vertex feature: wraps the reqwest::Client with a CLIENT-kind tracing
# span per rawPredict call (bridged to OTel/Elastic APM by downstream consumers).
reqwest-middleware = { version = "0.5", features = ["json"], optional = true }
reqwest-tracing = { version = "0.7", optional = true }

# Threat feed feature
chrono = { version = "0.4", features = ["serde"], optional = true }
urlencoding = { version = "2.1", optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
approx = "0.5"
tempfile = "3.26"
rand = "0.9"
mockito = "1.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[example]]
name = "generate_vectors"
path = "examples/generate_vectors.rs"
required-features = []

[[example]]
name = "generate_cm_lsh_vectors"
path = "examples/generate_cm_lsh_vectors.rs"
required-features = ["cm-lsh"]

[[example]]
name = "basic_signature"
path = "examples/basic_signature.rs"
required-features = []

[[example]]
name = "similarity_comparison"
path = "examples/similarity_comparison.rs"
required-features = []

[[example]]
name = "duplicate_detection"
path = "examples/duplicate_detection.rs"
required-features = []

[[example]]
name = "cm_lsh_example"
path = "examples/cm_lsh_example.rs"
required-features = ["cm-lsh"]

[[example]]
name = "sign_text"
path = "examples/sign_text.rs"
required-features = ["onnx"]

[[example]]
name = "benchmark_onnx_load"
path = "examples/benchmark_onnx_load.rs"
required-features = ["onnx"]

[[example]]
name = "benchmark_signatures"
path = "examples/benchmark_signatures.rs"
required-features = []

[[example]]
name = "extract_susfactor_goldens"
path = "examples/extract_susfactor_goldens.rs"
required-features = ["susfactor"]

[[example]]
name = "susfactor_vertex"
path = "examples/susfactor_vertex.rs"
required-features = ["susfactor-vertex"]

[[example]]
name = "susfactor_shadow"
path = "examples/susfactor_shadow.rs"
required-features = ["susfactor", "susfactor-vertex"]
