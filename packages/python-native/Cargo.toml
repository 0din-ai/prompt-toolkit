[package]
name = "odin-prompt-toolkit-python"
version = "0.5.0"
edition = "2021"
rust-version = "1.70"
authors = ["0din Team"]
description = "Native Python bindings for odin-prompt-toolkit LSH functions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0din-ai/prompt-toolkit"

[lib]
name = "odin_prompt_toolkit_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
odin-prompt-toolkit = { path = "../rust", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
