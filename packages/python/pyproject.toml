[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "0din-sig"
version = "0.1.1"
description = "Multi-language SDK for LSH signature generation for AI prompt similarity detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "0din Team"}
]
keywords = ["lsh", "locality-sensitive-hashing", "embeddings", "similarity", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]
onnx = [
    "onnxruntime>=1.16.0",
    "sentence-transformers>=2.2.0",
]
cm-lsh = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",  # For isotonic regression
]
native = [
    "odin-sig-native>=0.1.0",  # Rust acceleration (~627× speedup) - not published yet
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pdoc>=14.0.0",
]
all = [
    "openai>=1.0.0",
    "onnxruntime>=1.16.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "odin-sig-native>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/0din/sig-sdk"
Documentation = "https://github.com/0din/sig-sdk/tree/main/python"
Repository = "https://github.com/0din/sig-sdk"
Issues = "https://github.com/0din/sig-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["odin_sig"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function call in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
