[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odin-prompt-toolkit"
version = "0.5.0"
description = "Multi-language SDK for LSH signature generation for AI prompt similarity detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "0din Team"}
]
keywords = ["lsh", "locality-sensitive-hashing", "embeddings", "similarity", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]
onnx = [
    "onnxruntime>=1.16.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.0.0",
]
cm-lsh = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",  # For isotonic regression
]
threatfeed = [
    "aiohttp>=3.9.0,<3.14.0",
]
susfactor = [
    "torch>=2.0.0",
    "transformers>=4.0.0",
]
native = [
    "odin-prompt-toolkit-native>=0.1.0",  # Rust acceleration (~627× speedup) - not published yet
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "aioresponses>=0.7.4",
    "aiohttp>=3.9.0,<3.14.0",  # cap: aiohttp 3.14.0 broke aioresponses 0.7.8 mock
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pdoc>=14.0.0",
]
all = [
    "openai>=1.0.0",
    "onnxruntime>=1.16.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "aiohttp>=3.9.0,<3.14.0",
    "torch>=2.0.0",
    "transformers>=4.0.0",
    "odin-prompt-toolkit-native>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/0din-ai/prompt-toolkit"
Documentation = "https://github.com/0din-ai/prompt-toolkit/tree/main/python"
Repository = "https://github.com/0din-ai/prompt-toolkit"
Issues = "https://github.com/0din-ai/prompt-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["odin_prompt_toolkit"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function call in argument defaults
    # Pre-existing issues — suppressed to keep CI green; fix separately
    "B011",  # assert False in tests (use raise AssertionError instead)
    "B904",  # raise in except without from (chained exceptions)
    "B905",  # zip() without strict= parameter
    "E402",  # Module level import not at top (native acceleration pattern)
    "F821",  # Undefined name (forward-ref aiohttp in type annotation)
    "F841",  # Local variable assigned but never used
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "openai",
    "openai.*",
    "onnxruntime",
    "onnxruntime.*",
    "transformers",
    "transformers.*",
    "torch",
    "torch.*",
    "odin_prompt_toolkit_native",
    "sklearn",
    "sklearn.*",
    "aiohttp",
    "aiohttp.*",
]
ignore_missing_imports = true

# Disable strict checks for modules with optional dependencies
[[tool.mypy.overrides]]
module = [
    "odin_prompt_toolkit.providers.openai",
    "odin_prompt_toolkit.providers.onnx",
    "odin_prompt_toolkit.providers.model_cache",
    "odin_prompt_toolkit.hashers.lsh",
    "odin_prompt_toolkit.cm_lsh",
    "odin_prompt_toolkit.sign",
    "odin_prompt_toolkit.threatfeed.cache",
    "odin_prompt_toolkit.threatfeed.client",
    "odin_prompt_toolkit.susfactor.classifier",
    "odin_prompt_toolkit.susfactor.compare",
    "odin_prompt_toolkit.susfactor.onnx_classifier",
]
disable_error_code = ["misc", "no-any-return", "name-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
