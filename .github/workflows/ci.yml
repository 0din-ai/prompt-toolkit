name: CI

on:
  workflow_call:   # Allows other workflows to call this
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (all features)
        run: cd packages/rust && cargo test --all-features
      - name: Test (no features)
        run: cd packages/rust && cargo test --no-default-features
      - name: Clippy
        run: cd packages/rust && cargo clippy --all-features -- -D warnings
      - name: Doc
        run: cd packages/rust && cargo doc --all-features --no-deps

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: cd packages/python && pip install -e ".[dev]"
      - name: Test
        run: cd packages/python && pytest tests/ -v
      - name: Type check
        run: cd packages/python && mypy odin_sig/

  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: cd packages/typescript && npm ci
      - name: Build
        run: cd packages/typescript && npm run build
      - name: Test
        run: cd packages/typescript && npm test
      - name: Lint
        run: cd packages/typescript && npm run lint

  cross-validate:
    needs: [rust, python, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install all
        run: |
          cd packages/rust && cargo build --all-features
          cd ../python && pip install -e ".[all]"
          cd ../typescript && npm ci && npm run build
      - name: Cross-validate
        run: python scripts/cross_validate.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: cd docs && npm ci
      - name: Build
        run: cd docs && npm run build
