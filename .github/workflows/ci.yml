name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — runs the model-present parity job
    - cron: "0 2 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_parity:
        description: 'Skip the susfactor parity job (no model available)'
        type: boolean
        default: false

permissions: {}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Rust — unit tests + lib (no model required)
  # ────────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/rust

      - name: Test lib + cm-lsh
        working-directory: packages/rust
        run: cargo test --lib --features cm-lsh

      - name: Test susfactor unit tests (no model)
        working-directory: packages/rust
        # Unit tests in src/susfactor/classifier.rs don't need the model file.
        # The integration test (susfactor.rs) and parity test (susfactor_parity.rs)
        # are gated by SUSFACTOR_MODEL_DIR and skip cleanly without it.
        run: cargo test --lib --features susfactor

  # ────────────────────────────────────────────────────────────────────────────
  # Python — unit + offline-skip integration/parity tests
  # ────────────────────────────────────────────────────────────────────────────
  python:
    name: Python tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: packages/python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: packages/python
        # Parity + integration tests skip cleanly when the model is absent.
        run: python -m pytest tests/ -v

  # ────────────────────────────────────────────────────────────────────────────
  # TypeScript — unit + offline-skip parity tests
  # ────────────────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Install dependencies
        working-directory: packages/typescript
        run: npm ci

      - name: Build
        working-directory: packages/typescript
        run: npm run build

      - name: Test
        working-directory: packages/typescript
        # Parity tests skip cleanly when SUSFACTOR_MODEL_DIR is absent.
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # Go — unit + offline-skip parity tests
  # ────────────────────────────────────────────────────────────────────────────
  go:
    name: Go tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: packages/go/go.sum

      - name: Install CGo deps (ORT shared lib + libtokenizers)
        env:
          ORT_VERSION: "1.26.0"
          TOKENIZERS_VERSION: "1.27.0"
        run: |
          # ORT v1.26.0 is for the Go SDK (yalue/onnxruntime_go v1.31.0, API v26).
          # Install to /opt/ort-go/lib/ to avoid polluting /usr/local/lib, which
          # the Rust SDK's ort-sys probes when the download-binaries feature is used.
          # A stale v1.26 .so in /usr/local/lib causes ort-sys to reject it
          # ("could not link to the ONNX Runtime build") because Rust's ort crate
          # expects ORT 2.x, not 1.26.
          sudo mkdir -p /opt/ort-go/lib
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | tar -xz -C /opt/
          sudo cp "/opt/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" \
                  /opt/ort-go/lib/libonnxruntime.so
          # libtokenizers.a static lib — extract to /tmp first, then sudo-copy
          # (tar -xz -C /usr/local/lib/ fails with permission denied on Ubuntu runners)
          curl -fsSL \
            "https://github.com/daulet/tokenizers/releases/download/v${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz" \
            | tar -xz -C /tmp/
          sudo cp /tmp/libtokenizers.a /usr/local/lib/libtokenizers.a

      - name: Test (no model required — parity test skips automatically)
        working-directory: packages/go
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L/opt/ort-go/lib -L/usr/local/lib"
          ORT_LIB_PATH: /opt/ort-go/lib/libonnxruntime.so
        run: go test ./susfactor/... -count=1 -v

  # ────────────────────────────────────────────────────────────────────────────
  # Lint
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Rust fmt check
        working-directory: packages/rust
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: packages/rust
        run: cargo clippy --all-features -- -D warnings

      - name: Python ruff
        working-directory: packages/python
        run: |
          pip install ruff
          ruff check odin_prompt_toolkit/ tests/

      - name: TypeScript lint
        working-directory: packages/typescript
        run: |
          npm ci
          npm run lint

  # ────────────────────────────────────────────────────────────────────────────
  # SusFactor parity — model-present, nightly + susfactor path changes
  #
  # Requires:
  #   HF_TOKEN secret (both HF model repos are gated).
  # Will be skipped on forks (secrets not available) and on PRs that don't
  # touch susfactor paths.
  # ────────────────────────────────────────────────────────────────────────────
  susfactor-parity:
    name: SusFactor cross-SDK parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Run on nightly schedule or manual dispatch only. The secrets context is
    # unavailable in job-level if: conditions; forks without HF_TOKEN will have
    # the download steps fail with 401 — acceptable since this job only runs on
    # the upstream repo where the secret is configured.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.skip_parity != true
    steps:
      - name: Free disk space
        # The susfactor ONNX model is ~2.1 GB. Ubuntu runners ship with ~14 GB
        # free; Android SDK, .NET, and Haskell toolchains consume ~10 GB of that.
        # Remove them to avoid "No space left on device" during model download.
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/rust

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python deps (with susfactor extras)
        working-directory: packages/python
        run: pip install -e ".[dev,susfactor]" huggingface_hub

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Install TS deps
        working-directory: packages/typescript
        run: npm ci

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: packages/go/go.sum

      - name: Install Go CGo deps (ORT shared lib + libtokenizers)
        env:
          ORT_VERSION: "1.26.0"
          TOKENIZERS_VERSION: "1.27.0"
        run: |
          # ORT v1.26.0 is for the Go SDK (yalue/onnxruntime_go v1.31.0, API v26).
          # Install to /opt/ort-go/lib/ — NOT /usr/local/lib/ — so the system lib
          # path stays clean for the Rust SDK. The Rust ort crate uses the
          # "download-binaries" feature and fetches ORT 2.x at build time; ort-sys
          # then validates against /usr/local/lib/libonnxruntime.so if present. A
          # mismatched v1.26 .so there causes: "ort-sys could not link to the ONNX
          # Runtime build in /usr/local/lib/libonnxruntime.so". Using /opt/ort-go/lib/
          # avoids that probe entirely.
          sudo mkdir -p /opt/ort-go/lib
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            | tar -xz -C /opt/
          sudo cp "/opt/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so.${ORT_VERSION}" \
                  /opt/ort-go/lib/libonnxruntime.so
          # libtokenizers.a — extract to /tmp first, then sudo-copy
          curl -fsSL \
            "https://github.com/daulet/tokenizers/releases/download/v${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz" \
            | tar -xz -C /tmp/
          sudo cp /tmp/libtokenizers.a /usr/local/lib/libtokenizers.a

      # Download the ONNX model used by Rust + TypeScript
      - name: Download susfactor-e5-large-onnx (Rust + TS)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="0dinai/susfactor-e5-large-onnx",
              local_dir="/tmp/susfactor-v1",
              token=os.environ["HF_TOKEN"],
          )
          EOF

      # Download the PyTorch model used by Python
      - name: Download susfactor-e5-large (Python)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import snapshot_download
          # Python expects: <cache>/susfactor-v1/encoder/ + <cache>/susfactor-v1/head.pt
          # Adjust local_dir if the HF repo layout differs from what
          # susfactor_model_files_present() checks.
          snapshot_download(
              repo_id="0dinai/susfactor-e5-large",
              local_dir="/tmp/py-model-cache/susfactor-v1",
              token=os.environ["HF_TOKEN"],
          )
          EOF

      - name: Verify golden vectors are present
        run: |
          python - <<'EOF'
          import json, sys
          path = "spec/test-vectors/susfactor_vectors.json"
          doc = json.load(open(path))
          scored = [v for v in doc["vectors"] if v.get("rust_score") is not None]
          if not scored:
              print(f"ERROR: no scored vectors in {path}")
              print("Run: make generate-susfactor-goldens  then commit the result.")
              sys.exit(1)
          print(f"Found {len(scored)} scored golden vectors. Proceeding.")
          EOF

      - name: Run cross-SDK parity checks
        env:
          SUSFACTOR_MODEL_DIR: /tmp/susfactor-v1
          # SIGNATURE_SDK_MODEL_CACHE is NOT set at the step level — it would
          # leak into the Rust unit tests and break cache-path assertions that
          # expect the default ~/.cache/signature-sdk path. cross_validate.py
          # passes it only to the Python parity subprocess internally.
          # Go parity env vars — ORT lives in /opt/ort-go/lib/ (not /usr/local/lib/)
          # to keep the Rust ort-sys linker probe path clean (see Install Go CGo deps).
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-L/opt/ort-go/lib -L/usr/local/lib"
          ORT_LIB_PATH: /opt/ort-go/lib/libonnxruntime.so
        run: python scripts/cross_validate.py --susfactor-parity --py-model-cache /tmp/py-model-cache
