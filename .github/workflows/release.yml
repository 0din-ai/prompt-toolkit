name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.6.0) — use when tag push did not trigger automatically'
        required: true
        type: string

permissions: {}

jobs:
  # Validate that tag version matches all package versions
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      
      - name: Extract tag version
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Check version consistency
        env:
          TAG_VERSION: ${{ steps.tag.outputs.VERSION }}
        run: |
          echo "Tag version: $TAG_VERSION"
          echo ""
          
          # Extract versions from all sources
          RUST_VERSION=$(grep '^version = ' packages/rust/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          PYTHON_VERSION=$(grep '^version = ' packages/python/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          PYTHON_INIT_VERSION=$(grep '__version__ = ' packages/python/odin_prompt_toolkit/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          PYTHON_NATIVE_VERSION=$(grep '^version = ' packages/python-native/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TS_VERSION=$(grep '"version":' packages/typescript/package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          
          echo "Package versions:"
          echo "  Rust:                $RUST_VERSION"
          echo "  Python:              $PYTHON_VERSION"
          echo "  Python __init__:     $PYTHON_INIT_VERSION"
          echo "  Python-native:       $PYTHON_NATIVE_VERSION"
          echo "  TypeScript:          $TS_VERSION"
          echo ""
          
          # Check for mismatches
          FAIL=0
          if [ "$RUST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: Rust version ($RUST_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$PYTHON_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: Python version ($PYTHON_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$PYTHON_INIT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: Python __init__ version ($PYTHON_INIT_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$PYTHON_NATIVE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: Python-native version ($PYTHON_NATIVE_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          if [ "$TS_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: TypeScript version ($TS_VERSION) does not match tag ($TAG_VERSION)"
            FAIL=1
          fi
          
          if [ $FAIL -eq 1 ]; then
            echo ""
            echo "Version mismatch detected. Run 'scripts/bump-version.sh $TAG_VERSION' to sync versions."
            exit 1
          fi
          
          echo "✅ All versions match tag $TAG_VERSION"

  # Gate on CI passing
  ci:
    needs: [version-check]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip_parity: true

  # Build Python pure wheel + sdist
  build-python:
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install hatch
      - name: Build wheel and sdist
        run: make package-python
      - name: Verify wheel installs
        run: |
          python -m venv /tmp/test-env
          /tmp/test-env/bin/pip install dist/*.whl
          /tmp/test-env/bin/python -c "import odin_prompt_toolkit; print(odin_prompt_toolkit.__version__)"
      - name: Create customer zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p /tmp/odin-prompt-toolkit-python-${VERSION}
          cp dist/*.whl /tmp/odin-prompt-toolkit-python-${VERSION}/
          cp dist/*.tar.gz /tmp/odin-prompt-toolkit-python-${VERSION}/
          cp packages/python/INSTALL.md /tmp/odin-prompt-toolkit-python-${VERSION}/ 2>/dev/null || true
          cd /tmp && zip -r odin-prompt-toolkit-python-${VERSION}.zip odin-prompt-toolkit-python-${VERSION}/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            /tmp/odin-prompt-toolkit-python-*.zip

  # Build Python-native wheels for Linux (x86_64 + aarch64)
  build-native-linux:
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - arch: x86_64
            manylinux: auto
          - arch: aarch64
            manylinux: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          manylinux: ${{ matrix.target.manylinux }}
          target: ${{ matrix.target.arch }}
          working-directory: packages/python-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-${{ matrix.target.arch }}
          path: packages/python-native/dist/*.whl

  # Build Python-native wheels for macOS (x86_64 + arm64)
  build-native-macos:
    needs: [version-check, ci]
    strategy:
      matrix:
        target:
          - arch: x86_64
          - arch: aarch64
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          target: ${{ matrix.target.arch }}-apple-darwin
          working-directory: packages/python-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-${{ matrix.target.arch }}
          path: packages/python-native/dist/*.whl

  # Build Python-native wheels for Windows (x86_64)
  build-native-windows:
    needs: [version-check, ci]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13
          target: x86_64-pc-windows-msvc
          working-directory: packages/python-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-x86_64
          path: packages/python-native/dist/*.whl

  # Build Python-native source distribution
  build-native-sdist:
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          working-directory: packages/python-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-sdist
          path: packages/python-native/dist/*.tar.gz

  # Package Rust crate
  build-rust:
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Package crate
        run: make package-rust
      - name: Create customer zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p /tmp/odin-prompt-toolkit-rust-${VERSION}
          cp dist/odin-prompt-toolkit-${VERSION}.crate /tmp/odin-prompt-toolkit-rust-${VERSION}/
          cp packages/rust/README.md /tmp/odin-prompt-toolkit-rust-${VERSION}/
          cd /tmp && zip -r odin-prompt-toolkit-rust-${VERSION}.zip odin-prompt-toolkit-rust-${VERSION}/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-dist
          path: |
            dist/*.crate
            /tmp/odin-prompt-toolkit-rust-*.zip

  # Package TypeScript npm tarball
  build-typescript:
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Release workflow: never restore npm caches from prior runs when
          # publishing artifacts (cache-poisoning risk — see zizmor's
          # cache-poisoning audit). package-manager-cache defaults to true
          # and can silently enable caching based on package.json, even
          # without an explicit cache: input.
          package-manager-cache: false
      - name: Install dependencies
        run: cd packages/typescript && npm ci
      - name: Build and package
        run: make package-typescript
      - name: Create customer zip
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p /tmp/odin-prompt-toolkit-typescript-${VERSION}
          cp dist/*.tgz /tmp/odin-prompt-toolkit-typescript-${VERSION}/
          cp packages/typescript/README.md /tmp/odin-prompt-toolkit-typescript-${VERSION}/
          cd /tmp && zip -r odin-prompt-toolkit-typescript-${VERSION}.zip odin-prompt-toolkit-typescript-${VERSION}/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-dist
          path: |
            dist/*.tgz
            /tmp/odin-prompt-toolkit-typescript-*.zip

  # Build deliverable tarball and offline installer bundle (single job — shares model download)
  build-bundles:
    needs: [
      version-check,
      ci,
      build-python,
      build-native-linux,
      build-native-macos,
      build-native-windows,
      build-native-sdist
    ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Locate wheels
        run: |
          echo "=== python-dist artifact structure ==="
          find artifacts/python-dist -type f | sort
          echo "======================================"

          # Pure Python wheel (path includes full runner path prefix)
          PURE_WHEEL=$(find artifacts/python-dist -name "0din_prompt_toolkit-*-py3-none-any.whl" | head -1)
          if [[ -z "$PURE_WHEEL" ]]; then
            echo "ERROR: Pure Python wheel not found in artifact" && exit 1
          fi
          echo "Pure wheel: $PURE_WHEEL"
          echo "PURE_WHEEL=$PURE_WHEEL" >> $GITHUB_ENV

          # Native wheels — copy all platforms to packages/python-native/dist/
          mkdir -p packages/python-native/dist
          cp artifacts/native-linux-x86_64/*.whl   packages/python-native/dist/ || true
          cp artifacts/native-linux-aarch64/*.whl  packages/python-native/dist/ || true
          cp artifacts/native-macos-x86_64/*.whl   packages/python-native/dist/ || true
          cp artifacts/native-macos-aarch64/*.whl  packages/python-native/dist/ || true
          cp artifacts/native-windows-x86_64/*.whl packages/python-native/dist/ || true
          cp artifacts/native-sdist/*.tar.gz       packages/python-native/dist/ || true

          echo "Native wheels:"
          ls -lh packages/python-native/dist/

      - name: Download model from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p /tmp/model-cache/onnx

          python - <<'EOF'
          import os, huggingface_hub
          repo = "0dinai/jailbreak-embeddings-large-onnx"
          token = os.environ.get("HF_TOKEN")
          for filename in ["onnx/model.onnx", "onnx/model.onnx_data", "tokenizer.json", "config.json"]:
              huggingface_hub.hf_hub_download(
                  repo_id=repo,
                  filename=filename,
                  repo_type="model",
                  local_dir="/tmp/model-cache",
                  token=token,
              )
          EOF

          echo "Model files downloaded:"
          ls -lhR /tmp/model-cache/

      - name: Build deliverable tarball
        run: |
          cd deliverable
          ./build-tarball.sh \
            --pure-wheel "../$PURE_WHEEL" \
            --model-source /tmp/model-cache

      - name: Calculate deliverable checksum
        run: |
          cd deliverable
          sha256sum odin-prompt-toolkit-deliverable-*.tar.gz \
            > odin-prompt-toolkit-deliverable-${GITHUB_REF_NAME#v}.tar.gz.sha256
          cat *.sha256

      - name: Build offline installer bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NATIVE_WHEEL=$(find packages/python-native/dist \
            -name "0din_prompt_toolkit_native-${VERSION}-*-manylinux*_x86_64.whl" \
            | sort -V | tail -1)

          cd deliverable
          ./package-offline.sh \
            --pure-wheel "../$PURE_WHEEL" \
            --model-source /tmp/model-cache \
            ${NATIVE_WHEEL:+--native-wheel "../${NATIVE_WHEEL}"} \
            --output-dir . \
            --zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deliverable-tarball
          path: |
            deliverable/odin-prompt-toolkit-deliverable-*.tar.gz
            deliverable/odin-prompt-toolkit-deliverable-*.tar.gz.sha256
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-bundle
          path: |
            deliverable/odin-prompt-toolkit-offline-v*.zip
          retention-days: 90

  # Create GitHub Release with all artifacts
  release:
    needs: [
      build-python,
      build-native-linux,
      build-native-macos,
      build-native-windows,
      build-native-sdist,
      build-rust,
      build-typescript,
      build-bundles
    ]
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to create releases
    steps:
      # softprops/action-gh-release authenticates via GITHUB_TOKEN/input token,
      # not a persisted git credential, so this checkout doesn't need one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files

          # Python pure wheel + sdist + customer zip (all flat in artifact)
          cp artifacts/python-dist/*.whl release-files/ || true
          cp artifacts/python-dist/*.tar.gz release-files/ || true
          cp artifacts/python-dist/*.zip release-files/ || true

          # Python-native wheels (all platforms)
          cp artifacts/native-linux-x86_64/*.whl release-files/ || true
          cp artifacts/native-linux-aarch64/*.whl release-files/ || true
          cp artifacts/native-macos-x86_64/*.whl release-files/ || true
          cp artifacts/native-macos-aarch64/*.whl release-files/ || true
          cp artifacts/native-windows-x86_64/*.whl release-files/ || true
          cp artifacts/native-sdist/*.tar.gz release-files/ || true

          # Rust (crate + customer zip, flat)
          cp artifacts/rust-dist/*.crate release-files/ || true
          cp artifacts/rust-dist/*.zip release-files/ || true

          # TypeScript (tgz + customer zip, flat)
          cp artifacts/typescript-dist/*.tgz release-files/ || true
          cp artifacts/typescript-dist/*.zip release-files/ || true

          # Design partner deliverable tarball
          cp artifacts/deliverable-tarball/*.tar.gz release-files/ || true
          cp artifacts/deliverable-tarball/*.sha256 release-files/ || true

          # Offline installer bundle
          cp artifacts/offline-bundle/*.zip release-files/ || true

          echo "Release files:"
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: release-files/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
            # Tags like v0.2.0-beta.1 → prerelease=true

  # ────────────────────────────────────────────────────────────────────────────
  # Registry publishing — all via OIDC trusted publishing (no stored secrets).
  #
  # Every job below is gated on the protected `release` environment. Add required
  # reviewers to that environment (Settings > Environments > release) so a human
  # must approve before anything is pushed to a public registry.
  #
  # One-time registry setup (see .github/CI.md § Publishing):
  #   • PyPI:   add a trusted publisher (pending publisher works for the first
  #             upload) for both 0din-prompt-toolkit and 0din-prompt-toolkit-native.
  #   • crates.io / npm: publish v0.x once manually, then link this repo +
  #             workflow (release.yml) as a trusted publisher. OIDC cannot create
  #             the very first version on either registry.
  # ────────────────────────────────────────────────────────────────────────────

  # Publish pure Python package to PyPI
  publish-pypi:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: python-dist/
      - name: Collect distributions
        run: |
          mkdir -p dist
          find python-dist -name '0din_prompt_toolkit-*.whl'    -exec cp {} dist/ \;
          find python-dist -name '0din_prompt_toolkit-*.tar.gz' -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "ERROR: no 0din_prompt_toolkit distributions found in the python-dist artifact" >&2
            exit 1
          fi
          echo "Uploading:" && ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # Publish native (Rust-accelerated) wheels to PyPI.
  # Uses a distinct environment from publish-pypi: PyPI keys pending trusted
  # publishers on (owner, repo, workflow, environment) and rejects two
  # not-yet-existing projects sharing an identical tuple. `release-native`
  # keeps this publisher's tuple unique from the pure package's `release`.
  publish-pypi-native:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release-native
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native-artifacts/
      - name: Collect native wheels + sdist
        run: |
          mkdir -p dist
          find native-artifacts -name '0din_prompt_toolkit_native-*.whl'    -exec cp {} dist/ \;
          find native-artifacts -name '0din_prompt_toolkit_native-*.tar.gz' -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo "ERROR: no 0din_prompt_toolkit_native distributions found in the native-* artifacts" >&2
            exit 1
          fi
          echo "Uploading:" && ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # Publish Rust crate to crates.io
  publish-crates:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # exchanged by crates-io-auth-action for a short-lived token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish to crates.io
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  # Publish TypeScript package to npm (with provenance)
  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # npm trusted publishing + provenance (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Never restore npm caches when publishing (cache-poisoning risk).
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
        run: npm install -g npm@^11
      - name: Install and build
        working-directory: packages/typescript
        run: |
          npm ci
          npm run build
      - name: Publish to npm
        working-directory: packages/typescript
        # OIDC trusted publishing: no NODE_AUTH_TOKEN; provenance is emitted by default.
        run: npm publish --access public

  # Publish Go module: tag the submodule path and warm the module proxy.
  #
  # The Go module lives at packages/go, so `go get <module>@vX.Y.Z` only resolves
  # against a tag named `packages/go/vX.Y.Z` — the root `vX.Y.Z` tag is invisible
  # to the module system. This job creates that tag (idempotently) at the release
  # commit and asks proxy.golang.org to ingest it.
  publish-go:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # push the packages/go/vX.Y.Z tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Resolve version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${TAG_INPUT#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Create and push Go module tag
        run: |
          GO_TAG="packages/go/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${GO_TAG}" >/dev/null 2>&1; then
            echo "${GO_TAG} already exists on origin — skipping"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${GO_TAG}" -m "Go module release ${GO_TAG}"
            git push origin "${GO_TAG}"
          fi
      - name: Warm Go module proxy
        run: |
          MODULE=github.com/0din-ai/prompt-toolkit/packages/go
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "https://proxy.golang.org/${MODULE}/@v/v${VERSION}.info"; then
              echo "" && echo "Proxy ingested ${MODULE}@v${VERSION}"
              exit 0
            fi
            echo "Attempt ${i}: proxy not ready, waiting 15s..."
            sleep 15
          done
          echo "::warning::Proxy has not ingested the module yet; it will catch up on the first 'go get'."
