version: 2

updates:
  # Keeps SHA pins in .github/workflows/ current — non-negotiable: a pin that
  # never gets bumped defeats the purpose of pinning (design.md D6).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/packages/rust"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/packages/python-native"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/packages/typescript"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/go"
    schedule:
      interval: "weekly"
